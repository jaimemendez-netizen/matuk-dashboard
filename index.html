<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acceso · MATUK Automation Service</title>
<style>
:root{--navy:#0b1730;--azul:#6da7ec;--matuk:#1e3a7b;--txt-2:#c8d0de}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100%;display:grid;place-items:center;padding:16px;color:#fff;
  font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
  background:linear-gradient(rgba(11,23,48,.86),rgba(11,23,48,.92)),url("fondo-inicio.jpg") center/cover fixed,var(--navy)}
.caja{width:100%;max-width:400px;text-align:center;border:1px solid rgba(255,255,255,.16);border-radius:18px;
  padding:32px 26px;background:rgba(11,23,48,.55);backdrop-filter:blur(6px)}
.caja img{height:64px;filter:drop-shadow(0 0 14px rgba(109,167,236,.55))}
h1{margin:12px 0 4px;font-size:20px;letter-spacing:.06em}
p{margin:0 0 20px;color:var(--txt-2);font-size:14px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);
  color:#fff;font:inherit;outline:none}
input:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(109,167,236,.25)}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#fff;color:var(--matuk);
  font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:22px;margin-top:12px;font-size:13px;color:#ffb4b4}
#msg.ok{color:var(--txt-2)}
small{display:block;margin-top:14px;color:#8b97ad;font-size:12px}
</style>
</head>
<body>
<form class="caja" id="f" autocomplete="on">
  <img src="logo-icono.png" alt="MATUK">
  <h1>MATUK AUTOMATION SERVICE</h1>
  <p>Centro de información · uso interno</p>
  <input type="text" name="username" value="matuk" autocomplete="username" hidden>
  <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required autofocus>
  <button id="b" type="submit">Entrar</button>
  <div id="msg"></div>
  <small>La información se descifra solo en este navegador.</small>
</form>
<script>
const msg = (t, ok) => { const m = document.getElementById("msg"); m.textContent = t; m.className = ok ? "ok" : ""; };

function abrirDB(){ return new Promise((ok, mal) => { const r = indexedDB.open("matuk-acceso", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); }); }
async function db(op, v){ const d = await abrirDB(); return new Promise(ok => {
  const t = d.transaction("k", op === "get" ? "readonly" : "readwrite"), s = t.objectStore("k");
  const q = op === "get" ? s.get("llave") : s.put(v, "llave"); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); }

async function activar(){
  const reg = await navigator.serviceWorker.register("sw.js");
  await navigator.serviceWorker.ready;
  if (!navigator.serviceWorker.controller)
    await new Promise(ok => { navigator.serviceWorker.addEventListener("controllerchange", ok, {once:true}); setTimeout(ok, 3000); });
  if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage("llave-nueva");
  if (reg.active) reg.active.postMessage("llave-nueva");
  location.replace(location.href.split("#")[0].split("?")[0]);
}

async function inicio(){
  if (!("serviceWorker" in navigator) || !window.crypto || !crypto.subtle){
    msg("Este navegador no es compatible. Usa Chrome, Edge o Safari actualizados."); document.getElementById("b").disabled = true; return;
  }
  // Ya hay contraseña guardada en este navegador: entra directo (máx. 2 intentos para no ciclar)
  let n = 0; try { n = +sessionStorage.getItem("matuk-intentos") || 0; } catch(e){}
  if (n < 2 && await db("get")){
    try { sessionStorage.setItem("matuk-intentos", n + 1); } catch(e){}
    msg("Abriendo…", true); activar();
  }
}

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const b = document.getElementById("b"); b.disabled = true; msg("Verificando…", true);
  try{
    const meta = await (await fetch("enc/meta.json?v=" + Date.now(), {cache:"no-store"})).json();
    const sal = new Uint8Array(meta.sal.match(/../g).map(h => parseInt(h, 16)));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const llave = await crypto.subtle.deriveKey({name:"PBKDF2", salt:sal, iterations:meta.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const c = await (await fetch("enc/check.enc?v=" + Date.now(), {cache:"no-store"})).arrayBuffer();
    const t = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:new Uint8Array(c, 0, 12)}, llave, new Uint8Array(c, 12)));
    if (t !== "MATUK-OK") throw 0;
    await db("put", llave);
    try { sessionStorage.removeItem("matuk-intentos"); } catch(e){}
    msg("Acceso concedido. Abriendo…", true);
    await activar();
  }catch(e){
    msg("Contraseña incorrecta."); b.disabled = false; document.getElementById("pw").select();
  }
});
inicio();
</script>
</body>
</html>
